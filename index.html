<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>今天的心動小測驗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23ff8fb7'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-color: #fff3f8;
      --card-bg: #fffdfb;
      --text-main: #5c3b4a;
      --text-sub: #b07a90;
      --accent: #ff7aa8;
      --accent-soft: #ffe4ef;
      --border-color: #ffd0e2;
      --shadow: 0 10px 0 #ffd6e7;
      --font-display: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 階段二：可愛還在，但開始不對勁 */
    body.stage-2 {
      --bg-color: #e6dbe2;
      --card-bg: #f6eef2;
      --text-main: #4c3942;
      --text-sub: #8d6e7c;
      --accent: #c45678;
      --accent-soft: rgba(196, 86, 120, 0.14);
      --border-color: #e3c2cf;
      --shadow: 0 8px 0 #d9c3cc;
    }

    /* 階段三：完全腐化與極度壓迫 */
    body.stage-3 {
      --bg-color: #050505;
      --card-bg: #0c0808;
      --text-main: #f87171;
      --text-sub: #991b1b;
      --accent: #ef4444;
      --accent-soft: rgba(239, 68, 68, 0.18);
      --border-color: #450a0a;
      --shadow: 0 0 50px rgba(220, 38, 38, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at 14% 16%, #ffd6e8 0 16px, transparent 17px),
        radial-gradient(circle at 86% 10%, #ffe7a8 0 9px, transparent 10px),
        radial-gradient(circle at 82% 88%, #ffd0e4 0 20px, transparent 21px),
        radial-gradient(circle at 10% 84%, #fff 0 7px, transparent 8px);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      transition: background-color 1.4s ease, color 0.8s ease;
      position: relative;
    }

    body.stage-2 {
      background-image:
        radial-gradient(circle at 14% 16%, #d9c6cf 0 16px, transparent 17px),
        radial-gradient(circle at 86% 10%, #cfc3b4 0 9px, transparent 10px);
    }

    body.stage-3 {
      background-image: none;
    }

    /* 掃描線與暗角遮罩 */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      background: radial-gradient(circle, transparent 45%, rgba(0, 0, 0, 0.92) 100%);
      transition: opacity 1.5s ease;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0px,
        rgba(255, 255, 255, 0) 2px,
        rgba(0, 0, 0, 0.28) 3px,
        rgba(0, 0, 0, 0.28) 4px
      );
      transition: opacity 1s ease;
    }

    body.stage-2 .vignette { opacity: 0.28; }
    body.stage-2 .scanlines { opacity: 0.08; }
    body.stage-3 .vignette { opacity: 0.95; }
    body.stage-3 .scanlines { opacity: 0.65; }

    /* 畫面震動動畫 */
    @keyframes subtleShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-1.5px, 1px) rotate(-0.2deg); }
      50% { transform: translate(1.5px, -1px) rotate(0.2deg); }
      75% { transform: translate(-1px, -1.5px) rotate(-0.1deg); }
    }

    @keyframes heavyShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-9px, 6px) rotate(-1.4deg); }
      35% { transform: translate(10px, -7px) rotate(1.3deg); }
      55% { transform: translate(-7px, -8px) rotate(-0.8deg); }
      75% { transform: translate(8px, 7px) rotate(0.9deg); }
    }

    body.stage-2 .container,
    body.stage-3 .container {
      animation: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 28px;
      padding: 22px 22px 26px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 20;
      transition: background-color 1s ease, border-color 1s ease, box-shadow 1s ease, border-radius 0.8s ease;
    }

    body.stage-3 .container {
      border-width: 1px;
      border-radius: 16px;
      padding: 28px 24px;
    }

    .mascot-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 8px;
      animation: floaty 3.2s ease-in-out infinite;
    }

    .mascot {
      width: 112px;
      height: 112px;
      display: block;
    }

    .sparkle {
      position: absolute;
      color: #ff8fb7;
      font-size: 16px;
      line-height: 1;
    }

    .sparkle-a { top: 6px; left: -6px; }
    .sparkle-b { top: 18px; right: -8px; color: #ffc14d; }

    .pupil, .mouth { transform-box: fill-box; transform-origin: center; }
    .crack { opacity: 0; transition: opacity 1.2s ease; }
    body.stage-2 .crack { opacity: 0.9; }
    body.stage-2 .pupil { transform: translate(1px, 3px) scale(0.72); }
    body.stage-2 .mouth { stroke: #6b2438; transform: scaleX(1.45) translateY(3px); }
    body.stage-2 .blush { fill: #c9b3ba; }
    body.stage-2 .sparkle { opacity: 0.25; }
    body.stage-2 .mascot-wrap { animation: none; }

    body.stage-3 .mascot-wrap { display: none; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.5s ease;
    }

    .mute-btn {
      background: #fff;
      border: 2px solid var(--border-color);
      color: var(--text-sub);
      border-radius: 999px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      background: var(--border-color);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.4s ease, background-color 0.8s ease;
    }

    h1 {
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .whisper {
      font-size: 12px;
      color: #ef4444;
      min-height: 18px;
      margin-bottom: 14px;
      letter-spacing: 1px;
      opacity: 0.85;
      font-style: italic;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 15px 16px;
      border-radius: 18px;
      border: 2px solid var(--border-color);
      background: #fff;
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.25s ease, background-color 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .option-btn:hover, .option-btn:active {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateX(3px);
    }

    .option-btn:focus-visible,
    .primary-btn:focus-visible,
    .mute-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    body.stage-2 .option-btn.corrupted {
      color: #9f1239 !important;
      border-color: #e7b7c6 !important;
      background: #fff7f8 !important;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    body.stage-3 .option-btn.corrupted {
      color: #ff2a2a !important;
      border-color: #dc2626 !important;
      background: rgba(127, 29, 29, 0.35) !important;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 12px;
    }

    .primary-btn {
      width: 100%;
      padding: 15px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #f2558c;
      transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.4s ease;
    }

    body.stage-3 .primary-btn {
      border-radius: 12px;
      box-shadow: none;
      font-weight: 600;
    }

    body.stage-3 .mute-btn {
      background: transparent;
      border-width: 1px;
      border-radius: 8px;
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }

    /* 結果頁樣式 */
    .result-box {
      border: 1px solid #7f1d1d;
      background: rgba(69, 10, 10, 0.25);
      border-radius: 12px;
      padding: 18px;
      margin: 18px 0;
    }

    .result-type {
      font-size: 20px;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 14px;
      line-height: 1.7;
      color: #e2e8f0;
    }

    /* 全螢幕突臉 Canvas */
    #scareCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
      display: none;
      background: #140000;
    }

    #wordFlood {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #12060a;
      overflow: hidden;
    }

    #wordField {
      position: absolute;
      inset: 0;
    }

    .flood-word {
      position: absolute;
      color: #ffd6e4;
      line-height: 1.15;
      pointer-events: none;
      white-space: nowrap;
    }

    .flood-panel {
      position: relative;
      z-index: 2;
      max-width: 460px;
      margin: 14vh 16px 0;
      padding: 22px 18px 24px;
      text-align: center;
      background: #1a0c12;
      border: 2px solid #ff8fb8;
      border-radius: 22px;
    }

    .flood-lead {
      margin: 0 0 18px;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.55;
    }

    @media (prefers-reduced-motion: reduce) {
      body.stage-2 .container,
      body.stage-3 .container,
      .mascot-wrap {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <canvas id="scareCanvas"></canvas>
  <div id="wordFlood" class="hidden">
    <div id="wordField"></div>
    <div class="flood-panel">
      <p class="flood-lead">測驗還沒結束。<br>剩下的題目一定要做完。</p>
      <button class="primary-btn" id="floodContinue" type="button">繼續把測驗做完</button>
    </div>
  </div>

  <div class="container" id="appCard">
    <div class="mascot-wrap" aria-hidden="true">
      <span class="sparkle sparkle-a">✦</span>
      <span class="sparkle sparkle-b">♡</span>
      <svg class="mascot" viewBox="0 0 120 120">
        <circle cx="30" cy="30" r="16" fill="#ff8fb8" />
        <circle cx="90" cy="30" r="16" fill="#ff8fb8" />
        <circle cx="30" cy="30" r="8" fill="#ffd6e6" />
        <circle cx="90" cy="30" r="8" fill="#ffd6e6" />
        <circle cx="60" cy="64" r="36" fill="#ffb3d0" />
        <ellipse cx="60" cy="76" rx="16" ry="12" fill="#ffe8f1" />
        <ellipse cx="60" cy="72" rx="5.5" ry="4" fill="#d46b8c" />
        <ellipse cx="46" cy="58" rx="6.5" ry="7.5" fill="#fff" />
        <ellipse cx="74" cy="58" rx="6.5" ry="7.5" fill="#fff" />
        <ellipse class="pupil" cx="47" cy="60" rx="3.2" ry="3.8" fill="#5c3b4a" />
        <ellipse class="pupil" cx="75" cy="60" rx="3.2" ry="3.8" fill="#5c3b4a" />
        <circle cx="48.2" cy="58.4" r="1.2" fill="#fff" />
        <circle cx="76.2" cy="58.4" r="1.2" fill="#fff" />
        <ellipse class="blush" cx="34" cy="70" rx="6" ry="3.5" fill="#ff8fb8" />
        <ellipse class="blush" cx="86" cy="70" rx="6" ry="3.5" fill="#ff8fb8" />
        <path class="mouth" d="M54 80c3 4 9 4 12 0" fill="none" stroke="#e07498" stroke-width="2.4" stroke-linecap="round" />
        <path class="crack" d="M58 34l-2 12 5 3-3 10" fill="none" stroke="#6b2438" stroke-width="2" />
      </svg>
    </div>
    <div class="header-bar">
      <span class="badge" id="stageBadge">心動小測驗</span>
      <button class="mute-btn" id="muteBtn" type="button">🔊 音效開啟</button>
    </div>

    <!-- 起始畫面 -->
    <div id="startScreen">
      <h1>今天的心動小測驗</h1>
      <p class="subtitle">
        8 題短問，看你談戀愛時比較安心、黏人、想逃，還是又想靠近又害怕。<br><br>
        <span style="font-size: 12px; opacity: 0.75;">開著聲音會比較有感覺。</span>
      </p>
      <button class="primary-btn" id="startBtn" type="button">開始小測驗</button>
    </div>

    <!-- 測驗畫面 -->
    <div id="quizScreen" class="hidden">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="whisper" id="whisperText"></div>
      <h1 id="questionText"></h1>
      <div class="options-list" id="optionsList"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="resultScreen" class="hidden">
      <div class="whisper">尖叫停不下來。他就在你耳邊。</div>
      <h1 id="resultHeadline">深層情感寄生診斷書</h1>
      <div class="result-box">
        <div class="result-type" id="resultType"></div>
        <div class="result-desc" id="resultDesc"></div>
      </div>
      <button class="primary-btn" id="restartBtn" type="button">重新進行評估（傳給下一個受害者）</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 題庫與恐怖腐化文本設定
    // ==========================================
    const QUESTIONS = [
      {
        stage: 1,
        whisper: "",
        prompt: "1. 對方很久沒回訊息時，你通常會怎麼做？",
        options: [
          { text: "先去做自己的事", corrupt: "先去做自己的事", type: "secure" },
          { text: "一直看手機，確認有沒有已讀", corrupt: "一直看手機，確認有沒有已讀", type: "anxious" },
          { text: "覺得正好可以一個人安靜一下", corrupt: "覺得正好可以一個人安靜一下", type: "avoidant" },
          { text: "會覺得對方不要我了", corrupt: "會覺得對方不要我了", type: "fearful" }
        ]
      },
      {
        stage: 1,
        whisper: "",
        prompt: "2. 談戀愛之後，你希望有多少自己的空間？",
        options: [
          { text: "會分享生活，也各自留一點時間", corrupt: "會分享生活，也各自留一點時間", type: "secure" },
          { text: "最好隨時都知道對方在做什麼", corrupt: "最好隨時都知道對方在做什麼", type: "anxious" },
          { text: "對方太黏的話，我會想逃開", corrupt: "對方太黏的話，我會想逃開", type: "avoidant" },
          { text: "想靠近，又怕被看穿", corrupt: "想靠近，又怕被看穿", type: "fearful" }
        ]
      },
      {
        stage: 2,
        whisper: "遠處好像有人在叫。",
        prompt: "3. 半夜看到對方在線上，卻沒有讀你的訊息，你會怎麼想？",
        options: [
          { text: "可能只是在滑手機，還不一定是在看你", corrupt: "他可能正在看你打這幾個字", type: "secure" },
          { text: "會想再傳一則，確認他到底在不在", corrupt: "再傳一則，不然你會一直想", type: "anxious" },
          { text: "告訴自己晚點再說就好", corrupt: "你說晚點再說，心裡還是不安", type: "avoidant" },
          { text: "也先冷落他，看他會不會來找你", corrupt: "乾脆也消失，看他慌不慌", type: "fearful" }
        ]
      },
      {
        stage: 2,
        whisper: "那聲音好像近了一點。",
        prompt: "4. 你覺得最親近的人，真的懂你在想什麼嗎？",
        options: [
          { text: "會把話說開，通常也能好好解決", corrupt: "說開了，也不代表有人聽得見", type: "secure" },
          { text: "好像不懂，所以我會更用力地討好", corrupt: "他不懂，所以你更不敢停下來", type: "anxious" },
          { text: "本來就沒有人能完全懂另一個人", corrupt: "你早就知道，沒有人真的懂", type: "avoidant" },
          { text: "一靠近，最後常常還是會被傷害", corrupt: "靠近之後，還是會被丟掉", type: "fearful" }
        ]
      },
      {
        stage: 2,
        whisper: "先把這題答完。",
        wordFlood: true,
        prompt: "5. 如果今晚就要分開，你最害怕失去的是什麼？",
        options: [
          { text: "一起走過的那些日子", corrupt: "那些日子會一個人留在黑暗裡", type: "secure" },
          { text: "沒有對方，我會不知道自己是誰", corrupt: "沒有他，你會不知道自己是誰", type: "anxious" },
          { text: "又要重新習慣一個人生活", corrupt: "門一旦關上，就只剩你自己", type: "avoidant" },
          { text: "再一次被丟掉的感覺", corrupt: "你最怕的，是再被丟掉一次", type: "fearful" }
        ]
      },
      {
        stage: 3,
        whisper: "還不能停，後面還有題目。",
        prompt: "6. 關燈之後，你聽到身邊有呼吸聲。你會怎麼做？",
        options: [
          { text: "知道這只是測驗，還是會先想一下", corrupt: "你知道是題目，還是不敢動", type: "secure" },
          { text: "有人在旁邊，我會比較不怕", corrupt: "有人陪著，你就沒那麼怕", type: "anxious" },
          { text: "我寧願自己睡，不想靠得太近", corrupt: "你寧願自己一個人，也不想靠近", type: "avoidant" },
          { text: "我不敢睜開眼睛", corrupt: "你不敢睜開眼睛看是誰", type: "fearful" }
        ]
      },
      {
        stage: 3,
        whisper: "再兩題就結束。",
        prompt: "7. 如果交出一個秘密，就能永遠不被丟掉，你願意嗎？",
        options: [
          { text: "不願意。親密不需要賣掉自己", corrupt: "你不願意用秘密換留下來", type: "secure" },
          { text: "可以全部交出去，只要他留下來", corrupt: "只要他留著，你什麼都給", type: "anxious" },
          { text: "我寧願被忘掉，也不想被看光", corrupt: "被忘掉也好，至少不用被看光", type: "avoidant" },
          { text: "我覺得選哪一個都不太好", corrupt: "兩個選擇你都害怕", type: "fearful" }
        ]
      },
      {
        stage: 3,
        whisper: "最後一題。",
        finalJumpScare: true,
        prompt: "8. 你會不會覺得，有什麼東西正站在你背後看著你？",

    // 2. Web Audio API 即時恐怖音效合成器
    // ==========================================
    class HorrorAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.droneOsc = null;
        this.droneGain = null;
        this.heartbeatTimer = null;
        this.isMuted = false;
        this.failed = false;
      }

      init() {
        if (this.failed) return;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) {
              this.failed = true;
              return;
            }
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.isMuted ? 0 : 0.85;
            this.masterGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        } catch (err) {
          this.failed = true;
          this.ctx = null;
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.85, this.ctx.currentTime, 0.05);
        }
        return this.isMuted;
      }

      startDrone(freq = 55, volume = 0.02) {
        if (!this.ctx || this.failed) return;
        const now = this.ctx.currentTime;
        if (!this.droneOsc) {
          this.droneOsc = this.ctx.createOscillator();
          this.droneGain = this.ctx.createGain();
          this.droneOsc.type = "sawtooth";
          this.droneOsc.frequency.setValueAtTime(freq, now);

          const filter = this.ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(140, now);

          this.droneGain.gain.setValueAtTime(volume, now);
          this.droneOsc.connect(filter);
          filter.connect(this.droneGain);
          this.droneGain.connect(this.masterGain);
          this.droneOsc.start();
        } else {
          this.droneOsc.frequency.setTargetAtTime(freq, now, 0.5);
          this.droneGain.gain.setTargetAtTime(volume, now, 0.5);
        }
      }

      setHeartbeat(bpm, volume = 0.25) {
        if (this.heartbeatTimer) {
          clearInterval(this.heartbeatTimer);
          this.heartbeatTimer = null;
        }
        if (!bpm || !this.ctx) return;

        const beat = () => {
          if (this.isMuted || !this.ctx) return;
          const now = this.ctx.currentTime;
          this._thump(now, 68, volume);
          this._thump(now + 0.16, 54, volume * 0.75);
        };

        beat();
        this.heartbeatTimer = setInterval(beat, (60 / bpm) * 1000);
      }

      _thump(time, startFreq, vol) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(startFreq, time);
        osc.frequency.exponentialRampToValueAtTime(28, time + 0.14);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + 0.16);
      }

      playClick(corrupted = false) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = corrupted ? "sawtooth" : "sine";
        osc.frequency.setValueAtTime(corrupted ? 180 : 620, now);
        osc.frequency.exponentialRampToValueAtTime(corrupted ? 45 : 300, now + 0.08);

        gain.gain.setValueAtTime(corrupted ? 0.22 : 0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playStaticBurst(duration = 0.35, volume = 0.45) {
        if (!this.ctx || this.isMuted) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1600;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();
      }

      _distortCurve() {
        if (this._curve) return this._curve;
        const n = 2048;
        const curve = new Float32Array(n);
        const k = 28;
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
        }
        this._curve = curve;
        return curve;
      }

      _glottalCycle() {
        if (this._glot) return this._glot;
        const n = 1024;
        const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        const openEnd = 0.56;
        for (let i = 0; i < n; i++) {
          const t = i / n;
          let y;
          if (t < openEnd) {
            const u = t / openEnd;
            y = Math.sin(Math.PI * u);
            y = y * y;
          } else {
            const u = (t - openEnd) / (1 - openEnd);
            y = Math.cos(u * Math.PI * 0.5) * (1 - u) * (1 - u);
          }
          data[i] = y * 1.7 - 0.12;
        }
        this._glot = buf;
        return buf;
      }

      playScream(opts) {
        if (!this.ctx || this.isMuted) return;
        const options = opts || {};
        const duration = Math.max(0.7, options.duration || 1.7);
        const peak = options.peak == null ? 0.72 : options.peak;
        const requested = options.f0 || 760;
        const f0 = requested < 600 ? 820 : Math.max(680, Math.min(980, requested));
        const ctx = this.ctx;
        const t0 = ctx.currentTime + (options.delay || 0);
        this._duckMusic(t0, duration);
        const cycle = this._glottalCycle();
        const hzToRate = cycle.length / ctx.sampleRate;

        const bus = ctx.createGain();
        bus.gain.setValueAtTime(peak, t0);
        bus.connect(this.masterGain);

        const shaper = ctx.createWaveShaper();
        const curveN = 1024;
        const curve = new Float32Array(curveN);
        const drive = 5.5;
        for (let i = 0; i < curveN; i++) {
          const x = (i / (curveN - 1)) * 2 - 1;
          curve[i] = Math.tanh(drive * x) / Math.tanh(drive);
        }
        shaper.curve = curve;
        shaper.oversample = "4x";
        shaper.connect(bus);

        const mix = ctx.createGain();
        mix.gain.setValueAtTime(0.9, t0);
        mix.connect(shaper);

        const specs = [
          { from: 900, to: 760, q: 5.5, g: 1 },
          { from: 1450, to: 1760, q: 7, g: 0.55 },
          { from: 2700, to: 3000, q: 8, g: 0.22 },
          { from: 3500, to: 3600, q: 6, g: 0.08 }
        ];
        const filters = specs.map((spec) => {
          const bp = ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.setValueAtTime(spec.from, t0);
          bp.frequency.exponentialRampToValueAtTime(spec.to, t0 + Math.min(0.22, duration * 0.28));
          bp.Q.setValueAtTime(spec.q, t0);
          const g = ctx.createGain();
          g.gain.setValueAtTime(spec.g, t0);
          bp.connect(g);
          g.connect(mix);
          return bp;
        });

        const startF = Math.max(520, f0 * 0.78);
        const peakF = Math.min(1580, f0 * 1.7);
        const endF = Math.max(700, f0 * 0.92);
        const marks = [
          [0, startF],
          [0.04, peakF],
          [0.16, peakF * 0.86],
          [0.24, peakF],
          [0.38, peakF * 0.9],
          [0.48, peakF * 1.03],
          [0.62, peakF * 0.94],
          [0.76, peakF],
          [0.9, peakF * 0.88],
          [1, endF]
        ];

        [1, 1.007].forEach((ratio, voice) => {
          const src = ctx.createBufferSource();
          src.buffer = cycle;
          src.loop = true;
          const rate = (freq) => Math.max(0.05, freq * ratio * hzToRate);
          const param = src.playbackRate;
          param.setValueAtTime(rate(marks[0][1]), t0 + marks[0][0] * duration);
          for (let i = 1; i < marks.length; i++) {
            param.exponentialRampToValueAtTime(rate(marks[i][1]), t0 + marks[i][0] * duration);
          }

          const amp = ctx.createGain();
          const level = voice === 0 ? 0.9 : 0.16;
          amp.gain.setValueAtTime(0.001, t0);
          amp.gain.exponentialRampToValueAtTime(level, t0 + 0.012);
          const pushes = [0.18, 0.34, 0.51, 0.67, 0.82];
          pushes.forEach((mark, i) => {
            const at = t0 + mark * duration;
            if (at >= t0 + duration - 0.04) return;
            amp.gain.exponentialRampToValueAtTime(level * (i % 2 ? 0.62 : 1), at);
          });
          amp.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
          src.connect(amp);
          filters.forEach((bp) => amp.connect(bp));
          src.start(t0);
          src.stop(t0 + duration + 0.03);
        });

        const noiseLen = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
        const noiseData = noiseBuf.getChannelData(0);
        for (let i = 0; i < noiseLen; i++) noiseData[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuf;
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.setValueAtTime(1600, t0);
        hp.frequency.exponentialRampToValueAtTime(2600, t0 + Math.min(0.18, duration * 0.25));
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.001, t0);
        ng.gain.exponentialRampToValueAtTime(0.12, t0 + 0.03);
        ng.gain.exponentialRampToValueAtTime(0.05, t0 + duration * 0.55);
        ng.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
        noise.connect(hp);
        hp.connect(ng);
        ng.connect(mix);
        noise.start(t0);
        noise.stop(t0 + duration);
      }

      playJumpScare() {
        this.setHeartbeat(0);
        if (!this.ctx || this.isMuted) return;
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const gasp = 0.11;
        const len = Math.max(1, Math.floor(ctx.sampleRate * gasp));
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const env = Math.sin((i / len) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env;
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = "bandpass";
        hp.frequency.setValueAtTime(1400, now);
        hp.Q.setValueAtTime(0.7, now);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.28, now);
        src.connect(hp);
        hp.connect(g);
        g.connect(this.masterGain);
        src.start(now);
        src.stop(now + gasp);
        this.playScream({ duration: 2.15, peak: 0.74, f0: 920, delay: 0.05 });

      _duckMusic(from, duration) {
        if (!this.musicGain || !this.ctx) return;
        this.musicGain.gain.setTargetAtTime(0.08, from, 0.03);
        this.musicGain.gain.setTargetAtTime(0.95, from + duration, 0.25);
      }

      startMusic() {
        if (!this.ctx || this.failed) return;
        if (!this.musicGain) {
          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.setValueAtTime(0.95, this.ctx.currentTime);
          this.musicGain.connect(this.masterGain);
          this._startPad();
        } else {
          this.musicGain.gain.setTargetAtTime(0.95, this.ctx.currentTime, 0.08);
        }
        if (this.musicTimer) return;
        this.nextNoteAt = this.ctx.currentTime + 0.06;
        this.musicTimer = setInterval(() => {
          try { this._pumpMusic(); } catch (err) {}
        }, 70);
      }

      setMood(questionIndex) {
        const step = Math.max(0, Math.min(7, questionIndex));
        this.mood = step / 7;
        if (step === 0) {
          this.musicStep = 0;
          this.skipLock = null;
          this.skipFlip = false;
        }
        this.startMusic();
        if (this.padGain && this.ctx) {
          const level = 0.055 * (1 - this.mood * 0.85);
          this.padGain.gain.setTargetAtTime(Math.max(0.004, level), this.ctx.currentTime, 0.4);
        }
      }

      stopMusic() {
        if (this.musicTimer) {
          clearInterval(this.musicTimer);
          this.musicTimer = null;
        }
        if (this.musicGain && this.ctx) {
          this.musicGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.08);
        }
      }

      _startPad() {
        if (this.padGain || !this.musicGain) return;
        const now = this.ctx.currentTime;
        this.padGain = this.ctx.createGain();
        this.padGain.gain.setValueAtTime(0.05, now);
        this.padGain.connect(this.musicGain);
        [196, 261.63, 329.63].forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          osc.connect(gain);
          gain.connect(this.padGain);
          osc.start(now);
        });
      }

      _pumpMusic() {
        if (!this.ctx) return;
        const horizon = this.ctx.currentTime + 0.28;
        let guard = 0;
        while (this.nextNoteAt < horizon && guard < 8) {
          this._scheduleNote();
          guard += 1;
        }
      }

      _scheduleNote() {
        const melody = [523.25, 659.25, 783.99, 880, 783.99, 659.25, 587.33, 523.25, 659.25, 783.99, 1046.5, 987.77, 880, 783.99, 659.25, 587.33];
        const mood = this.mood || 0;
        let freq;
        let skipped = false;
        if (mood > 0.7) {
          if (this.skipLock == null) this.skipLock = this.musicStep % melody.length;
          const slot = (this.skipLock + (this.skipFlip ? 1 : 0)) % melody.length;
          this.skipFlip = !this.skipFlip;
          freq = melody[slot];
          skipped = true;
        } else {
          this.skipLock = null;
          const skipChance = mood < 0.25 ? 0 : (mood - 0.18) * 0.9;
          skipped = Math.random() < skipChance;
          freq = melody[this.musicStep % melody.length];
          if (!skipped) this.musicStep += 1;
        }
        if (mood > 0.34 && (this.musicStep % 5 === 4)) freq *= 0.94387;
        freq *= 1 - mood * 0.1;
        freq *= 1 + (Math.random() - 0.5) * mood * 0.07;
        const gap = skipped ? (0.09 + Math.random() * 0.04) : Math.max(0.22, 0.46 - mood * 0.14);
        if (!this.isMuted) {
          this._boxNote(Math.max(80, freq), this.nextNoteAt, mood, skipped);
          if (skipped && mood > 0.4) this._needle(this.nextNoteAt);
        }
        this.nextNoteAt += gap;
      }

      _boxNote(freq, time, mood, skipped) {
        const osc = this.ctx.createOscillator();
        const partial = this.ctx.createOscillator();
        const partialGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = mood > 0.62 ? "triangle" : "sine";
        partial.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        partial.frequency.setValueAtTime(freq * 2, time);
        if (mood > 0.45) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * (1 - mood * 0.06)), time + 0.1);
        }
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(mood > 0.62 ? 980 : 3200, time);
        partialGain.gain.setValueAtTime(mood > 0.5 ? 0.04 : 0.16, time);
        const level = skipped ? 0.16 : 0.26;
        const dur = skipped ? 0.08 : 0.38;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(level, time + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        osc.connect(filter);
        partial.connect(partialGain);
        partialGain.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);
        osc.start(time);
        partial.start(time);
        osc.stop(time + dur + 0.02);
        partial.stop(time + dur + 0.02);
      }

      _needle(time) {
        const len = Math.max(1, Math.floor(this.ctx.sampleRate * 0.012));
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const hp = this.ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.setValueAtTime(1800, time);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.4, time);
        src.connect(hp);
        hp.connect(gain);
        gain.connect(this.musicGain);
        src.start(time);
      }

      stopAll() {
        this.setHeartbeat(0);
        this.stopMusic();
        if (this.droneGain && this.ctx) {
          this.droneGain.gain.setTargetAtTime(0.01, this.ctx.currentTime, 0.3);
        }
      }
    }

    function prepareCanvas(canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx: ctx, w: w, h: h };
    }

    function drawScarePhoto(canvas, flash) {
      const surface = prepareCanvas(canvas);
      const ctx = surface.ctx;
      const w = surface.w;
      const h = surface.h;
      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, w, h);
      if (flash) {
        ctx.fillStyle = "#f2f2f2";
        ctx.fillRect(0, 0, w, h);
        return;
      }
      if (!(SCARE_PHOTO.complete && SCARE_PHOTO.naturalWidth)) return;
      const iw = SCARE_PHOTO.naturalWidth;
      const ih = SCARE_PHOTO.naturalHeight;
      const scale = Math.max(w / iw, h / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      ctx.drawImage(SCARE_PHOTO, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }

    function showCanvas() {
      const canvas = document.getElementById("scareCanvas");
      canvas.style.display = "block";
      return canvas;
    }

    function hideCanvas() {
      const canvas = document.getElementById("scareCanvas");
      canvas.style.display = "none";
      const ctx = canvas.getContext("2d");
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ==========================================
    // 4. 測驗流程
    // ==========================================
    const audio = new HorrorAudioEngine();
    const scores = { secure: 0, anxious: 0, avoidant: 0, fearful: 0 };
    const lastPick = { secure: -1, anxious: -1, avoidant: -1, fearful: -1 };

    let index = 0;
    let locked = false;
    let finished = false;
    let hesitateTimer = null;
    let scareTimer = null;
    let floodTimer = null;
    let scareFrame = 0;

    const FLOOD_WORDS = [
      "做到最後",
      "不准關掉",
      "還有題目",
      "一定要做完",
      "不要離開",
      "測驗還沒結束",
      "把剩下的答完",
      "現在不能停",
      "再往下做",
      "做完才算",
      "後面還有三題",
      "請繼續",
      "不要中途關掉",
      "答完才能離開",
      "還沒結束"
    ];

    function clearTimers() {
      if (hesitateTimer) {
        clearTimeout(hesitateTimer);
        hesitateTimer = null;
      }
      if (floodTimer) {
        clearInterval(floodTimer);
        floodTimer = null;
      }
      if (scareTimer) {
        clearTimeout(scareTimer);
        scareTimer = null;
      }
      if (scareFrame) {
        cancelAnimationFrame(scareFrame);
        scareFrame = 0;
      }
    }

    function resetScores() {
      Object.keys(scores).forEach((key) => {
        scores[key] = 0;
        lastPick[key] = -1;
      });
    }

    function applyStage(stage) {
      document.body.classList.remove("stage-2", "stage-3");
      if (stage >= 3) document.body.classList.add("stage-3");
      else if (stage >= 2) document.body.classList.add("stage-2");
      document.getElementById("stageBadge").textContent = BADGES[stage] || BADGES[1];

      if (stage <= 1) {
        audio.startDrone(196, 0.004);
        audio.setHeartbeat(0);
      } else if (stage === 2) {
        audio.startDrone(48, 0.05);
        audio.setHeartbeat(78, 0.22);
      } else {
        audio.startDrone(31, 0.09);
        audio.setHeartbeat(156, 0.4);
      }
    }

    function renderQuestion() {
      const q = QUESTIONS[index];
      locked = false;
      const fill = document.getElementById("progressFill");
      fill.style.width = ((index / QUESTIONS.length) * 100) + "%";
      document.getElementById("whisperText").textContent = q.whisper || "";
      document.getElementById("questionText").textContent = q.prompt;

      const list = document.getElementById("optionsList");
      list.replaceChildren();
      const uneasy = q.stage >= 3;
      q.options.forEach((opt, optIndex) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn" + (uneasy ? " corrupted" : "");
        btn.textContent = uneasy ? opt.corrupt : opt.text;
        btn.addEventListener("click", () => choose(optIndex));
        list.appendChild(btn);
      });

      applyStage(q.stage);
      audio.setMood(index);

      if (q.finalJumpScare) {
        hesitateTimer = setTimeout(() => {
          if (locked || finished) return;
          locked = true;
          triggerJumpScare(() => finishQuiz());
        }, 3500);
      }
    }

    function choose(optIndex) {
      if (locked || finished) return;
      locked = true;
      clearTimers();

      const q = QUESTIONS[index];
      const opt = q.options[optIndex];
      scores[opt.type] += 1;
      lastPick[opt.type] = index;
      audio.playClick(q.stage >= 2);

      if (q.wordFlood) {
        showWordFlood(() => advance());
        return;
      }
      if (q.finalJumpScare) {
        triggerJumpScare(() => finishQuiz());
        return;
      }
      advance();
    }

    function advance() {
      index += 1;
      if (index >= QUESTIONS.length) finishQuiz();
      else renderQuestion();
    }

    function dominantType() {
      let best = "secure";
      Object.keys(scores).forEach((key) => {
        const betterScore = scores[key] > scores[best];
        const tieBrokenByLater = scores[key] === scores[best] && lastPick[key] > lastPick[best];
        if (betterScore || tieBrokenByLater) best = key;
      });
      return best;
    }

    function finishQuiz() {
      if (finished) return;
      finished = true;
      clearTimers();
      hideCanvas();
      audio.stopAll();
      const result = RESULTS[dominantType()];
      document.getElementById("resultType").textContent = result.title;
      document.getElementById("resultDesc").textContent = result.desc;
      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.remove("hidden");
      document.body.classList.remove("stage-2");
      document.body.classList.add("stage-3");
      document.getElementById("stageBadge").textContent = "診斷已寫入";
    }

    function showWordFlood(done) {
      const layer = document.getElementById("wordFlood");
      const field = document.getElementById("wordField");
      field.replaceChildren();
      layer.classList.remove("hidden");
      let count = 0;
      const spawn = () => {
        for (let i = 0; i < 4; i++) {
          const word = document.createElement("span");
          word.className = "flood-word";
          word.textContent = FLOOD_WORDS[count % FLOOD_WORDS.length];
          word.style.left = (Math.random() * 72) + "%";
          word.style.top = (Math.random() * 86) + "%";
          word.style.fontSize = (15 + Math.random() * 26) + "px";
          word.style.opacity = String(0.28 + Math.random() * 0.72);
          word.style.color = Math.random() > 0.82 ? "#ff5d7a" : "#ffd6e4";
          word.style.transform = "rotate(" + ((Math.random() - 0.5) * 16) + "deg)";
          field.appendChild(word);
          count += 1;
        }
        if (count >= 96 && floodTimer) {
          clearInterval(floodTimer);
          floodTimer = null;
        }
      };
      spawn();
      floodTimer = setInterval(spawn, 90);
      document.getElementById("floodContinue").onclick = () => {
        if (floodTimer) {
          clearInterval(floodTimer);
          floodTimer = null;
        }
        layer.classList.add("hidden");
        field.replaceChildren();
        if (done) done();
      };
    }

    function holdScare(ms, done) {
      const canvas = showCanvas();
      drawScarePhoto(canvas, true);
      scareTimer = setTimeout(() => {
        if (canvas.style.display !== "block") return;
        drawScarePhoto(canvas, false);
        scareTimer = setTimeout(() => {
          hideCanvas();
          if (done) done();
        }, Math.max(0, ms - 80));
      }, 80);
    }

    function flashScare(ms, done) {
      try { audio.playScream({ duration: Math.max(1.35, ms / 1000), peak: 0.8, f0: 900 }); } catch (err) {}
      holdScare(ms, done);
    }

    function triggerJumpScare(done) {
      try { audio.playJumpScare(); } catch (err) {}
      holdScare(2800, done);
    }

    function showQuiz() {
      finished = false;
      locked = false;
      index = 0;
      resetScores();
      clearTimers();
      hideCanvas();
      document.getElementById("wordFlood").classList.add("hidden");
      document.getElementById("wordField").replaceChildren();
      document.body.classList.remove("stage-2", "stage-3");
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");
      renderQuestion();
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      audio.init();
      showQuiz();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      audio.init();
      showQuiz();
    });

    document.getElementById("muteBtn").addEventListener("click", () => {
      audio.init();
      const isMuted = audio.toggleMute();
      document.getElementById("muteBtn").textContent = isMuted ? "🔇 音效關閉" : "🔊 音效開啟";
    });
  </script>
</body>
</html>
