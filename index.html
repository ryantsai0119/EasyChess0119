<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#141018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="青銅前線">
  <title>青銅前線</title>
  <meta name="description" content="單線戰爭：用金幣招兵，沿一條战线推向敵營。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css?v=20260829f">
  <link rel="stylesheet" href="styles.css?v=20260829f">
</head>
<body class="is-booting">
  <main id="app">
    <div id="boot-splash" class="boot-splash" role="dialog" aria-modal="true" aria-labelledby="boot-title">
      <div class="boot-glow" aria-hidden="true"></div>
      <div class="boot-mark" aria-hidden="true">
        <span class="boot-keep"></span>
        <span class="boot-blade"></span>
      </div>
      <p class="boot-studio">BRONZE FRONT</p>
      <h1 class="boot-title" id="boot-title">青銅前線</h1>
      <p class="boot-hint" id="boot-hint">點擊開始</p>
    </div>

    <section id="screen-menu" class="screen screen-title is-on" aria-labelledby="menu-title">
      <div class="title-sky" aria-hidden="true">
        <canvas id="title-field" width="1280" height="720"></canvas>
      </div>
      <div class="title-veil" aria-hidden="true"></div>
      <div class="title-menu">
        <p class="kicker">單線戰爭</p>
        <h1 id="menu-title">青銅前線</h1>
        <p class="title-progress" id="progress-stat">第 1 戰</p>
        <button type="button" class="btn-play" id="btn-continue">開始遊戲</button>
        <div class="title-secondary">
          <button type="button" class="btn-ghost" data-screen="battles">戰役選擇</button>
          <button type="button" class="btn-ghost" id="btn-how">怎麼打</button>
        </div>
      </div>
    </section>

    <section id="screen-battles" class="screen screen-select" hidden aria-labelledby="battles-title">
      <header class="select-head">
        <button type="button" class="btn-back" data-screen="menu">返回</button>
        <div>
          <h2 id="battles-title">戰役</h2>
          <p>一條路，兩座營。越後面的敵人越會存錢。</p>
        </div>
      </header>
      <ol class="campaign" id="campaign"></ol>
    </section>

    <section id="screen-play" class="screen screen-play" hidden aria-labelledby="play-title">
      <div class="stage">
        <figure class="field-frame">
          <canvas id="field" width="1280" height="720" aria-label="戰場"></canvas>
          <figcaption class="sr-only">左側是你的營壘，右側是敵營。單位沿中間土路推進。</figcaption>
        </figure>

        <header class="hud" id="hud">
          <div class="hud-left">
            <h2 id="play-title" class="hud-title">河岸斥候</h2>
            <p class="hud-age" id="hud-age">銅器</p>
          </div>
          <div class="hud-gold" aria-live="polite">
            <span class="hud-gold-value" id="hud-gold">0</span>
            <span class="hud-gold-rate" id="hud-income">+0／秒</span>
          </div>
          <button type="button" class="btn-menu" id="btn-menu" aria-haspopup="dialog">選單</button>
        </header>

        <p class="toast" id="console-hint" role="status"></p>
      </div>

      <div class="dock" id="console">
        <div class="dock-units" id="unit-row" role="group" aria-label="招兵"></div>
        <div class="dock-cmds" id="cmd-row" role="group" aria-label="指令"></div>
      </div>
    </section>
  </main>

  <div id="panel-how" class="overlay" hidden>
    <div class="overlay-card overlay-card-wide" role="dialog" aria-modal="true" aria-labelledby="how-title">
      <h2 id="how-title">怎麼打</h2>
      <ul class="how-list">
        <li>金幣每秒進帳。打死敵兵再拿一筆。錢不夠的格子會暗掉。</li>
        <li>點格子出兵，或按鍵盤 <kbd>1</kbd>–<kbd>9</kbd>。單位自己上路，遠程會停下來射。</li>
        <li>升年代解鎖更硬的兵。砲塔守營前。<kbd>A</kbd> 年代 · <kbd>T</kbd> 砲塔。</li>
        <li>戰號暫時增傷，鐵器起可放火箭打中段。<kbd>H</kbd> · <kbd>V</kbd>。空白鍵或 <kbd>Esc</kbd> 暫停。</li>
      </ul>
      <div class="overlay-actions">
        <button type="button" class="btn-primary" id="btn-how-close">知道了</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h2 id="overlay-title">暫停</h2>
      <p id="overlay-copy"></p>
      <div class="overlay-actions" id="overlay-actions"></div>
    </div>
  </div>

  <script src="art.js?v=20260829f"></script>
  <script src="audio.js?v=20260829f"></script>
  <script src="game.js?v=20260829f"></script>
</body>
</html>
